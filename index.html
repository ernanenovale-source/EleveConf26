<style>
:root {
  --orange:#F5A300; --orange-dark:#D4860A;
  --red:#D42B1E;    --red-dark:#A81F14;
  --bg:#F5A300;     --text:#1A0800;
  --white:rgba(255,255,255,0.9);
  --muted:rgba(26,8,0,0.52);
  --green:#1A6B32;  --green-bg:rgba(26,107,50,0.12);
  --amber:#7A4800;  --amber-bg:rgba(196,117,0,0.13);
  --radius:6px;     --radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem;}

/* ── HEADER ── */
.app-header{position:sticky;top:0;z-index:20;background:var(--red);padding:.875rem 1.25rem .5rem;box-shadow:0 2px 0 var(--red-dark);}
.header-eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:1px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;font-size:12px;letter-spacing:.1em;color:var(--orange);text-transform:uppercase;}
.verse-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45);}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:.88;color:#fff;text-shadow:3px 3px 0 var(--red-dark);}
.header-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:3px;}

/* ── TAB NAV ── */
.tab-nav{display:flex;background:var(--red-dark);}
.tab-btn{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;font-style:italic;letter-spacing:.08em;text-transform:uppercase;padding:10px 0;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
.tab-btn.active{color:#fff;border-bottom-color:var(--orange);}

/* ── FILTER ── */
.filter-row{display:flex;gap:6px;padding:.65rem 1rem;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;font-style:italic;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:3px;border:2px solid rgba(0,0,0,.18);background:rgba(255,255,255,.28);color:var(--text);cursor:pointer;white-space:nowrap;transition:all .15s;}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red-dark);}

/* ── CARDS ── */
.day-group{padding:0 1rem;margin-top:.5rem;}
.day-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;font-style:italic;letter-spacing:.1em;text-transform:uppercase;color:var(--red);padding:.625rem 0 .4rem;display:flex;align-items:center;gap:8px;}
.day-label::after{content:'';flex:1;height:2px;background:rgba(0,0,0,.15);border-radius:2px;}
.card{background:var(--white);border-radius:var(--radius-lg);margin-bottom:.5rem;overflow:hidden;animation:fadeUp .2s ease both;box-shadow:2px 3px 0 rgba(0,0,0,.15);}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card.done{opacity:.42;}
.card-body{padding:.875rem 1rem .875rem 1.1rem;border-left:5px solid var(--red);}
.card.imediata .card-body{border-left-color:#C47500;}
.card.done     .card-body{border-left-color:rgba(26,107,50,.65);}
.card-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;}
.card-num{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;font-style:italic;color:#fff;background:var(--red);padding:1px 7px;border-radius:3px;flex-shrink:0;margin-top:1px;}
.card.imediata .card-num{background:#C47500;}
.card.done     .card-num{background:rgba(26,107,50,.75);}
.card-title{font-size:14px;font-weight:600;line-height:1.4;flex:1;color:#1A0800;}
.card-time{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;font-style:italic;color:var(--red);flex-shrink:0;}
.card.imediata .card-time{color:#C47500;}
.card.done     .card-time{color:rgba(26,107,50,.8);}
.desc-list{margin:6px 0 0 2px;padding-left:14px;font-size:13px;line-height:1.7;color:#1A0800;}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center;}
.tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;font-style:italic;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:3px;}
.tag-who{background:rgba(0,0,0,.07);color:rgba(26,8,0,.6);}
.tag-local{background:var(--orange);color:var(--red-dark);}
.tag-plan{background:rgba(26,107,50,.11);color:var(--green);}
.tag-imediata{background:var(--amber-bg);color:var(--amber);animation:pulse 1.6s ease-in-out infinite;}
.tag-concluido{background:rgba(26,107,50,.82);color:#fff;}
.tag-cancelado{background:rgba(100,100,100,.15);color:#666;text-decoration:line-through;}
.card.cancelado{opacity:.3;}
.tag-tel{background:rgba(0,0,0,.06);color:rgba(26,8,0,.55);font-style:normal;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px;}

/* ── DASHBOARD ── */
.dash{padding:1rem;display:none;flex-direction:column;gap:1rem;}
.dash.active{display:flex;}
.dash-section{background:var(--white);border-radius:var(--radius-lg);padding:1rem;box-shadow:2px 3px 0 rgba(0,0,0,.13);}
.dash-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;font-style:italic;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:.875rem;border-left:4px solid var(--red);padding-left:8px;}

/* kpi row */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:0;}
.kpi-card{background:var(--white);border-radius:var(--radius-lg);padding:.875rem 1rem;box-shadow:2px 3px 0 rgba(0,0,0,.13);border-top:4px solid var(--red);}
.kpi-card.green{border-top-color:var(--green);}
.kpi-card.amber{border-top-color:#C47500;}
.kpi-card.orange{border-top-color:var(--orange-dark);}
.kpi-value{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;font-style:italic;line-height:1;color:var(--red);}
.kpi-card.green  .kpi-value{color:var(--green);}
.kpi-card.amber  .kpi-value{color:#C47500;}
.kpi-card.orange .kpi-value{color:var(--orange-dark);}
.kpi-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;}
.d-legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;}
.d-leg-item{display:flex;align-items:center;gap:8px;}
.d-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.d-leg-label{color:var(--muted);font-weight:500;flex:1;}
.d-leg-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;font-size:14px;color:var(--text);}

/* bars */
.bar-rows{display:flex;flex-direction:column;gap:10px;}
.bar-row{}
.bar-header{display:flex;justify-content:space-between;margin-bottom:4px;}
.bar-label{font-size:12px;font-weight:600;color:var(--text);}
.bar-meta{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;font-style:italic;color:var(--muted);}
.bar-track{background:rgba(0,0,0,.08);border-radius:99px;height:10px;overflow:hidden;display:flex;}
.bar-seg{height:100%;border-radius:99px;transition:width .5s ease;}

/* person detail */
.pdc{background:rgba(245,163,0,.07);border:1px solid rgba(0,0,0,.07);border-radius:var(--radius);padding:.625rem .75rem;margin-bottom:.5rem;}
.pdc-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;font-style:italic;color:var(--red);margin-bottom:6px;}
.pdc-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;font-style:italic;padding:2px 8px;border-radius:3px;}
.pill-total {background:rgba(0,0,0,.07);color:var(--text);}
.pill-done  {background:rgba(26,107,50,.82);color:#fff;}
.pill-pend  {background:rgba(212,43,30,.1);color:var(--red);}
.pill-imed  {background:var(--amber-bg);color:var(--amber);}
.pill-plan  {background:rgba(26,107,50,.11);color:var(--green);}
.pdc-pct{font-size:11px;color:var(--muted);margin-bottom:4px;}
.pdc-bar{background:rgba(0,0,0,.08);border-radius:99px;height:6px;overflow:hidden;display:flex;}
</style>
</head>

  btn.classList.add('active');
  document.getElementById('tab-pedidos').style.display = tab==='pedidos'?'block':'none';
  const dash = document.getElementById('tab-dash');
  if(tab==='dash'){ dash.classList.add('active'); renderDash(); }
  else dash.classList.remove('active');
}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  let filtered = filter==='todos' ? tasks : tasks.filter(t=>t.day===filter);
  const days=[...new Set(filtered.map(t=>t.day))];
  let html='';
  if(!filtered.length){ html='<div class="empty">Nenhum pedido.</div>'; }
  else {
    days.forEach(day=>{
      const dt=filtered.filter(t=>t.day===day);
      html+=`<div class="day-group"><div class="day-label">${day}</div>`;
      dt.forEach((t,i)=>{
        const isDone=doneIds.has(t.id), isImed=t.status==='imediata', isCan=t.cancelado;
        const bHTML=t.bullets?`<ul class="desc-list">${t.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:'';
        const stTag=isImed?`<span class="tag tag-imediata">⚡ Imediata</span>`:`<span class="tag tag-plan">📅 Planejado</span>`;
        const dTag=isCan?`<span class="tag tag-cancelado">❌ Cancelado</span>`:isDone?`<span class="tag tag-concluido">✅ Concluído</span>`:'';
        const telTag=t.tel!=='Confidencial'?`<span class="tag tag-tel">📞 ${t.tel}</span>`:'';
        html+=`<div class="card${isDone?' done':''}${isImed?' imediata':''}${isCan?' cancelado':''}" style="animation-delay:${i*.03}s">
          <div class="card-body">
            <div class="card-row1">
              <span class="card-num">#${String(t.id).padStart(2,'0')}</span>
              <span class="card-title">${t.desc}</span>
              <span class="card-time">${t.time}</span>
            </div>${bHTML}
            <div class="card-tags">${stTag}${dTag}<span class="tag tag-who">${t.who}</span>${t.local?`<span class="tag tag-local">${t.local}</span>`:''}${telTag}</div>
          </div></div>`;
      });
      html+='</div>';
    });
  }
  document.getElementById('taskList').innerHTML=html;
}

function renderDash(){
  renderKPI();
  renderDonut();
  renderDayBars();
  renderTypeBars();
  renderPersonBars();
  renderPersonDetail();
}

function renderKPI(){
  const done=doneIds.size;
  const canc=cancIds.size;
  const pend=TOTAL-done;
  const imed=tasks.filter(t=>t.status==='imediata'&&!doneIds.has(t.id)&&!cancIds.has(t.id)).length;
  const pct=Math.round(done/TOTAL*100);
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi-card"><div class="kpi-value">${TOTAL}</div><div class="kpi-label">Total</div><div class="kpi-sub">${tasks.filter(t=>t.status==='plan'&&!t.cancelado).length} plan. · ${tasks.filter(t=>t.status==='imediata'&&!t.cancelado).length} imed.</div></div>
    <div class="kpi-card green"><div class="kpi-value">${done}</div><div class="kpi-label">Concluídos</div><div class="kpi-sub">${pct}% do total</div></div>
    <div class="kpi-card amber"><div class="kpi-value">${pend}</div><div class="kpi-label">Pendentes</div><div class="kpi-sub">${100-pct}% do total</div></div>
    <div class="kpi-card orange"><div class="kpi-value">${imed}</div><div class="kpi-label">⚡ Imediatas abertas</div><div class="kpi-sub">demandam ação</div></div>
    <div class="kpi-card" style="border-top:4px solid rgba(150,150,150,.5);grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:.625rem 1rem;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;font-style:italic;color:#999;">❌ ${canc}</div>
      <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#aaa;">Cancelado${canc!==1?'s':''}</div><div style="font-size:11px;color:#bbb;margin-top:1px;">não contabilizado${canc!==1?'s':''} nos demais indicadores</div></div>
    </div>`;
}

function renderDonut(){
  const done=doneIds.size, pend=TOTAL-done;
  const pct=done/TOTAL;
  const cx=60,cy=60,r=46,circ=2*Math.PI*r;
  const dD=circ*pct, off=circ*.25;
  document.getElementById('donutSvg').innerHTML=`
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="14"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1A6B32" stroke-width="14"
      stroke-dasharray="${dD} ${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(212,43,30,.3)" stroke-width="14"
      stroke-dasharray="${circ*(1-pct)} ${circ}" stroke-dashoffset="${off-dD}" stroke-linecap="round"/>
    <text x="${cx}" y="${cy-7}" text-anchor="middle" font-family="Barlow Condensed" font-weight="900" font-size="22" fill="#1A0800">${Math.round(pct*100)}%</text>
    <text x="${cx}" y="${cy+11}" text-anchor="middle" font-family="Barlow Condensed" font-size="11" fill="#7A6050">concluído</text>`;

  const iT=tasks.filter(t=>t.status==='imediata'&&!t.cancelado).length;
  const iD=tasks.filter(t=>t.status==='imediata'&&doneIds.has(t.id)).length;
  document.getElementById('donutLegend').innerHTML=`
    <div class="d-leg-item"><div class="d-leg-dot" style="background:#1A6B32"></div><span class="d-leg-label">Concluídos</span><span class="d-leg-val">${done}</span></div>
    <div class="d-leg-item"><div class="d-leg-dot" style="background:rgba(212,43,30,.5)"></div><span class="d-leg-label">Pendentes</span><span class="d-leg-val">${pend}</span></div>
    <div class="d-leg-item"><div class="d-leg-dot" style="background:#C47500"></div><span class="d-leg-label">⚡ Imediatas</span><span class="d-leg-val">${iT}</span></div>
    <div class="d-leg-item"><div class="d-leg-dot" style="background:#E8A830"></div><span class="d-leg-label">↳ Abertas</span><span class="d-leg-val">${iT-iD}</span></div>
    <div class="d-leg-item"><div class="d-leg-dot" style="background:rgba(26,107,50,.4)"></div><span class="d-leg-label">📅 Planejadas</span><span class="d-leg-val">${tasks.filter(t=>t.status==='plan'&&!t.cancelado).length}</span></div>`;
}

function stackBar(label, done, total, colorDone, colorPend){
  const pct=total?Math.round(done/total*100):0;
  return `<div class="bar-row">
    <div class="bar-header"><span class="bar-label">${label}</span><span class="bar-meta">${done}/${total} · ${pct}%</span></div>
    <div class="bar-track">
      <div class="bar-seg" style="width:${done/total*100}%;background:${colorDone};border-radius:99px;"></div>
      <div class="bar-seg" style="width:${(total-done)/total*100}%;background:${colorPend};border-radius:99px;"></div>
    </div></div>`;
}

function renderDayBars(){
  const days=['Qui 30/04','Sex 01/05','Sáb 02/05'];
  let h='';
  days.forEach(d=>{
    const t=tasks.filter(x=>x.day===d&&!x.cancelado);
    const dn=t.filter(x=>doneIds.has(x.id)).length;
    h+=stackBar(d,dn,t.length,'#1A6B32','rgba(212,43,30,.18)');
  });
  document.getElementById('dayBars').innerHTML=h;
}

function renderTypeBars(){
  const plan=tasks.filter(t=>t.status==='plan'&&!t.cancelado);
  const imed=tasks.filter(t=>t.status==='imediata'&&!t.cancelado);
  const pD=plan.filter(t=>doneIds.has(t.id)).length;
  const iD=imed.filter(t=>doneIds.has(t.id)).length;
  document.getElementById('typeBars').innerHTML=
    stackBar('📅 Planejadas',pD,plan.length,'#1A6B32','rgba(26,107,50,.15)')+
    stackBar('⚡ Imediatas', iD,imed.length,'#C47500','rgba(196,117,0,.18)');
}

function renderPersonBars(){
  const people=[...new Set(tasks.filter(t=>!t.cancelado).map(t=>t.who))];
  let h='';
  people.forEach(p=>{
    const pt=tasks.filter(t=>t.who===p&&!t.cancelado);
    const pd=pt.filter(t=>doneIds.has(t.id)).length;
    h+=stackBar(p,pd,pt.length,'#1A6B32','rgba(212,43,30,.18)');
  });
  document.getElementById('personBars').innerHTML=h;
}

function renderPersonDetail(){
  const people=[...new Set(tasks.filter(t=>!t.cancelado).map(t=>t.who))];
  let h='';
  people.forEach(p=>{
    const pt=tasks.filter(t=>t.who===p&&!t.cancelado);
    const pd=pt.filter(t=>doneIds.has(t.id)).length;
    const pp=pt.length-pd;
    const pimed=pt.filter(t=>t.status==='imediata').length;
    const pplan=pt.filter(t=>t.status==='plan').length;
    const pct=pt.length?Math.round(pd/pt.length*100):0;
    const barD=pt.length?pd/pt.length*100:0;
    h+=`<div class="pdc">
      <div class="pdc-name">${p}</div>
      <div class="pdc-pills">
        <span class="pill pill-total">${pt.length} total</span>
        <span class="pill pill-done">✅ ${pd} ok</span>
        <span class="pill pill-pend">🔲 ${pp} pend.</span>
        <span class="pill pill-imed">⚡ ${pimed} imed.</span>
        <span class="pill pill-plan">📅 ${pplan} plan.</span>
      </div>
      <div class="pdc-pct">${pct}% concluído</div>
      <div class="pdc-bar">
        <div class="bar-seg" style="width:${barD}%;background:#1A6B32;border-radius:99px;"></div>
        <div class="bar-seg" style="width:${100-barD}%;background:rgba(212,43,30,.15);border-radius:99px;"></div>
      </div>
    </div>`;
  });
  document.getElementById('personDetail').innerHTML=h;
}

renderList();
</script>
</body>
</html>
